# Builds this fork and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/watchtower (linux/amd64 + linux/arm64).
#
# Why this exists: the stacks on the Pi (family-medcard, megamcp) used to run
# a third-party watchtower image. They now run the image built here, so the
# code that has root-equivalent access to the docker socket is the code in
# this repository.
#
# Tags published:
#   latest          — every push to the default branch
#   <branch>        — pushes to other branches (slashes become dashes)
#   sha-<short>     — every build, the tag to pin a stack to
#   X.Y.Z / X.Y / X — when a vX.Y.Z git tag is pushed
name: Publish image to GHCR

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed for `git describe`, which feeds --version.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version string
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            # No tags in a fresh fork — fall back to the short SHA rather than
            # failing the build.
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Watchtower (fork)
            org.opencontainers.image.description=Automated Docker container base image updates, built from this fork

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WATCHTOWER_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=watchtower-ghcr
          cache-to: type=gha,mode=max,scope=watchtower-ghcr,ignore-error=true

      - name: Smoke test published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail
          # The runner is amd64, so running the entrypoint exercises the amd64
          # half of the manifest; the arm64 half is checked through the
          # manifest list below.
          docker run --rm "$IMAGE" --help | tee /tmp/help.txt
          # The flags the stacks pass must exist in this build, or watchtower
          # dies on startup with "unknown flag" the moment the stack rolls.
          for flag in --scope --label-enable --cleanup --stop-timeout --schedule; do
            grep -q -- "$flag" /tmp/help.txt
          done

          # This image has no shell, so the version is checked on the binary
          # itself: an empty ldflag would silently ship v0.0.0-unknown.
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/watchtower" /tmp/watchtower-bin
          docker rm "$cid"
          grep -qa "$EXPECTED_VERSION" /tmp/watchtower-bin

          # The self-recognition label must survive into the final image,
          # otherwise watchtower restarts itself mid-update.
          test "$(docker image inspect --format '{{ index .Config.Labels "com.centurylinklabs.watchtower" }}' "$IMAGE")" = "true"

          docker buildx imagetools inspect "$IMAGE" --format '{{ range .Manifest.Manifests }}{{ .Platform.OS }}/{{ .Platform.Architecture }} {{ end }}' | tee /tmp/platforms.txt
          grep -q "linux/arm64" /tmp/platforms.txt
          grep -q "linux/amd64" /tmp/platforms.txt

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
